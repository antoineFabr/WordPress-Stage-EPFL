services:
  mysql:
    image: mysql:latest
    container_name: mariadb-container
    environment:
      MYSQL_ROOT_PASSWORD: votre-root-pw
      MYSQL_DATABASE: votre-db
      MYSQL_USER: votre-user
      MYSQL_PASSWORD: votre-pw
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

volumes:
  mysql_data:
